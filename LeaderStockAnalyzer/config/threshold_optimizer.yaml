optimizer:
  # LeaderStockAnalyzer exists to identify market leadership, not to maximize
  # forward price returns. D+5/D+20 remain secondary diagnostics only.
  objective_profile: leadership_quality
  leadership_validity_column: leadership_valid_10d

  # Labels use up to 10 future trading days (Persistence conversion), so purge
  # 10 trading days between Train and Validation to avoid label overlap.
  min_train_trading_days: 60
  validation_trading_days: 40
  step_trading_days: 40
  purge_trading_days: 10
  min_validation_fraction: 0.75

  min_train_samples: 30
  min_train_unique_dates: 15
  train_top_k: 50

  min_samples: 30
  min_unique_dates: 15
  min_valid_folds: 2
  top_n: 50

  allow_provisional_fallback: true
  acceptable_min_fold_coverage: 0.50
  robust_min_valid_folds: 3
  robust_min_fold_coverage: 0.75
  robust_min_plateau_neighbors: 2
  robust_max_plateau_drop: 0.75

  robustness_std_penalty: 0.50
  plateau_penalty: 0.20
  distance_penalty: 0.10
  coverage_penalty: 0.50

  # Objective: does a detected leader remain a real market leader?
  objective_weights:
    leader_retention: 0.30
    market_rank_retention: 0.20
    persistence_conversion: 0.15
    turnover_retention: 0.15
    sector_leadership: 0.10
    false_leader_quality: 0.10

search_space:
  confirmed:
    confirmed_leader: [70, 72.5, 75, 77.5, 80, 82.5]
    confirmed_timing: [60, 65, 70, 75, 80]
    max_chase_risk: [40, 50, 60, 70]
    min_breakout_quality: [45, 55, 65, 70]

  strong:
    strong_leader: [82.5, 85, 87.5, 90]
    strong_timing: [72.5, 75, 77.5, 80]
    max_chase_risk: [40, 50, 60, 70]
    min_breakout_quality: [65, 70, 75, 80]
    strong_rank_max: [3, 5, 10]
