optimizer:
  target_column: D+5
  mae_column: MAE_D5
  excursion_column: excursion_ratio_D5

  min_train_trading_days: 80
  validation_trading_days: 40
  step_trading_days: 40
  purge_trading_days: 5

  min_train_samples: 30
  min_train_unique_dates: 15
  min_samples: 20
  min_unique_dates: 10
  min_valid_folds: 2
  train_top_k: 50
  top_n: 50

  robustness_std_penalty: 0.50
  plateau_penalty: 0.20
  distance_penalty: 0.10
  coverage_penalty: 0.50

  objective_weights:
    median_return: 0.30
    win_rate: 0.20
    p25_return: 0.20
    mae_quality: 0.15
    excursion_ratio: 0.05
    sample_size: 0.10

# D+5 coarse search.
# Lower bounds find the minimum quality floor; upper bounds prevent
# overextended Leader/RS/high-selection names from dominating CONFIRMED.
search_space:
  confirmed:
    selection_min: [67.5, 70, 72.5]
    selection_max: [85, 90, 100]
    timing_min: [70, 72, 75]
    timing_max: [80, 100]
    leader_min: [65, 70]
    leader_max: [80, 85, 100]
    relative_strength_min: [40, 60]
    relative_strength_max: [90, 95, 100]
    risk_max_exclusive: [50, 55, 60]
