market:
  benchmark: '^KS11'
  timeframe: '1d'

moving_average:
  short: 5
  life: 20
  mid: 60
  long: 120
  slope_lookback: 5
  distance_warn_life_pct: 0.12
  distance_warn_long_pct: 0.25

volume:
  avg_window: 20
  confirm_ratio: 1.5
  strong_ratio: 2.0
  dry_ratio: 0.7

bollinger:
  window: 21
  std_mult: 2.0
  squeeze_lookback: 120
  squeeze_percentile: 0.20

candlestick:
  doji_body_ratio: 0.12
  long_wick_ratio: 0.45
  long_body_ratio: 0.60

structure:
  pivot_left: 3
  pivot_right: 3
  level_tolerance_pct: 0.02
  min_level_touches: 2
  breakout_buffer_pct: 0.005
  pattern_lookback: 180

selection:
  min_score: 62
  watch_score: 52
  max_candidates: 30
  reject_if_below_long_ma: false
  require_market_uptrend_for_pyramiding: true
  # Final D+5 live policy is applied after sector context is attached.
  rank_by_d5_score: false

# Legacy analyzer-level overextension score. Kept for audit/backward compatibility.
overextension:
  enabled: true
  max_total_penalty: 20
  selection:
    threshold: 85
    step: 5
    penalty_per_step: 1.5
    cap: 4.5
  leader:
    threshold: 85
    step: 5
    penalty_per_step: 2.0
    cap: 6.0
  relative_strength:
    threshold: 90
    step: 5
    penalty_per_step: 2.0
    cap: 6.0
  chase_risk:
    medium_penalty: 0.0
    high_penalty: 4.0

# KJB D+5 FINAL V1.
# Frozen after diagnostics + purged walk-forward review.
# Optimizer V2 did not beat this baseline OOS, so these values are the production policy.
d5_v2:
  enabled_for_live: true
  selection_weight: 0.45
  timing_weight: 0.55
  selection_min: 70
  timing_min: 72
  d5_score_min: 70
  overextension_max_exclusive: 8
  rs_hard: 92
  leader_soft: 80
  leader_hard: 88
  sector_soft: 78
  sector_hard: 86
  combo_rs_leader_penalty: 3
  combo_triple_penalty: 4
  daily_top_n: 3
  # Market regime is informational only in the final production policy.
  market_regime: all

# Baseline CONFIRMED prerequisite. D+5 live policy never promotes baseline WATCH.
confirmation_v1:
  use_d5_score: false
  selection_min: 70
  selection_max: 100
  timing_min: 72
  timing_max: 100
  leader_min: 70
  leader_max: 100
  relative_strength_min: 40
  relative_strength_max: 100
  risk_max_exclusive: 60
  reject_high_chase: true
  watch_selection_min: 62
  watch_technical_min: 62
  watch_risk_max_exclusive: 65

timing:
  chase_recent_5d_return: 0.10
  timing_good: 70
  timing_excellent: 80
  technical_good: 72
  technical_strong: 80
  risk_high: 65

risk:
  initial_stop_pct: 0.08
  max_stop_pct: 0.20
  trailing_stop_pct: 0.12
  initial_entry_pct: 0.30
  add_entry_pcts: [0.20, 0.15, 0.10, 0.10]

weights:
  trend: 24
  location: 16
  candle: 10
  volume: 14
  structure: 16
  pattern: 10
  bollinger: 10
