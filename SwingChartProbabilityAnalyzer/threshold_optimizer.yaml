optimizer:
  target_column: D+20_Close_Return_Pct
  mae_column: MAE_20D_Pct
  excursion_column: optimizer_excursion_ratio_D20

  min_train_trading_days: 80
  validation_trading_days: 40
  step_trading_days: 40
  purge_trading_days: 20

  min_train_samples: 25
  min_train_unique_dates: 12
  min_samples: 15
  min_unique_dates: 8
  min_valid_folds: 1
  train_top_k: 5
  top_n: 10

  robustness_std_penalty: 0.50
  plateau_penalty: 0.25
  distance_penalty: 0.10
  coverage_penalty: 0.50

  objective_weights:
    median_return: 0.30
    win_rate: 0.20
    p25_return: 0.15
    mae_quality: 0.15
    excursion_ratio: 0.10
    sample_size: 0.10

search_space:
  confirmed:
    confirmed_score: [80, 85, 90, 92, 95]
