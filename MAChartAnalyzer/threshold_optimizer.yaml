optimizer:
  target_column: D+20_Close_Return_Pct
  mae_column: __unused_mae_d20__
  excursion_column: __unused_excursion_d20__

  min_train_trading_days: 80
  validation_trading_days: 40
  step_trading_days: 40
  purge_trading_days: 20

  min_train_samples: 30
  min_train_unique_dates: 15
  min_samples: 20
  min_unique_dates: 10
  min_valid_folds: 1
  train_top_k: 30
  top_n: 30

  robustness_std_penalty: 0.50
  plateau_penalty: 0.20
  distance_penalty: 0.10
  coverage_penalty: 0.50

  objective_weights:
    median_return: 0.40
    win_rate: 0.25
    p25_return: 0.20
    mae_quality: 0.00
    excursion_ratio: 0.00
    sample_size: 0.15

search_space:
  confirmed:
    confirmed_score: [65, 70, 75, 80]
    confirmed_timing_score: [40, 50, 60, 70]
    max_ma20_distance_pct: [6, 8, 10, 12]

  strong:
    strong_confirmed_score: [75, 80, 85, 90]
    strong_timing_score: [60, 70, 80, 90]
