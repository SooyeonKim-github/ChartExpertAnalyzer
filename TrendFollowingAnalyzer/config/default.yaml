universe:
  top_n: 100
  candidate_multiplier: 3
  min_price: 1000
  exclude_spac: true

data:
  history_days: 520

rule_policy:
  # Experimental/Backtest-only rules are recorded but never remove candidates.
  experimental_filters_enabled: false

trend:
  # LECTURE_CORE
  ma_short: 50
  ma_long: 150
  slope_lookback: 20

  # EXPERIMENTAL + BACKTEST_ONLY
  # The lecture says slope should point upward/downward, but gives no 0.30% threshold.
  experimental_slope_threshold_pct: 0.30

market_regime:
  history_days: 520

  # LECTURE_CORE
  # 30-week MA is approximated by daily MA150.
  ma_short: 50
  ma_long: 150
  slope_lookback: 20

  # EXPERIMENTAL + BACKTEST_ONLY
  experimental_slope_threshold_pct: 0.30

  breadth_52w:
    # LECTURE_CORE concept, but current measurement is a closing-price proxy.
    # Keep BACKTEST_ONLY until Range/Ablation validation.
    mode: BACKTEST_ONLY
    enabled: true
    lookback_sessions: 252
    min_history_sessions: 252
    short_window: 5
    long_window: 20
    min_coverage_ratio: 0.60

  intraday_strength:
    # LECTURE_CORE concept: weak-open/strong-close vs strong-open/weak-close.
    # Current implementation is a DAILY OHLC proxy, so it is BACKTEST_ONLY.
    mode: BACKTEST_ONLY
    enabled: true

    # EXPERIMENTAL thresholds; lecture does not specify these numbers.
    strong_clv_threshold: 0.70
    weak_clv_threshold: 0.30
    short_window: 5
    long_window: 20

  # LECTURE_CORE but not implemented yet.
  news_reaction:
    mode: PLANNED

output:
  encoding: utf-8-sig
