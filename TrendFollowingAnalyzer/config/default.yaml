universe:
  top_n: 100
  candidate_multiplier: 3
  min_price: 1000
  exclude_spac: true
  snapshot_primary: true

data:
  history_days: 520

rule_policy:
  experimental_filters_enabled: false

trend:
  ma_short: 50
  ma_long: 150
  slope_lookback: 20
  experimental_slope_threshold_pct: 0.30

market_regime:
  history_days: 520
  ma_short: 50
  ma_long: 150
  slope_lookback: 20
  experimental_slope_threshold_pct: 0.30

  breadth_52w:
    mode: BACKTEST_ONLY
    enabled: true
    lookback_sessions: 252
    min_history_sessions: 252
    short_window: 5
    long_window: 20
    min_coverage_ratio: 0.60
    snapshot_fail_fast: 2
    allow_current_universe_fallback: true

  intraday_strength:
    mode: BACKTEST_ONLY
    enabled: true
    strong_clv_threshold: 0.70
    weak_clv_threshold: 0.30
    short_window: 5
    long_window: 20

  news_reaction:
    mode: PLANNED

relative_strength:
  mode: BACKTEST_ONLY
  enabled: true
  short_window: 20
  long_window: 60
  experimental_min_percentile: 80.0

prior_advance:
  mode: BACKTEST_ONLY
  enabled: true
  lookback_sessions: 120
  recent_window_sessions: 20
  experimental_min_advance_pct: 30.0

base:
  mode: BACKTEST_ONLY
  enabled: true
  min_base_sessions: 15
  max_base_sessions: 60
  experimental_max_depth_pct: 35.0
  experimental_max_end_drawdown_pct: 12.0
  experimental_resistance_tolerance_pct: 3.0
  experimental_loose_ratio: 1.25

volume_contraction:
  mode: BACKTEST_ONLY
  enabled: true
  experimental_max_contraction_ratio: 0.80
  experimental_max_down_vs_up_ratio: 1.00
  experimental_dry_up_volume_ratio: 0.70
  experimental_min_dry_up_day_ratio: 0.20

breakout:
  mode: BACKTEST_ONLY
  enabled: true
  experimental_min_close_breakout_pct: 0.0
  experimental_min_volume_ratio: 1.50
  experimental_near_breakout_pct: 3.0
  reference_volume_sessions: 20

backtest:
  version: V1
  horizons: [5, 20, 60]
  universe_policy: POINT_IN_TIME_ONLY
  structure_only_for_lecture_core: true
  overlap_policy: SIGNAL_LEVEL_EVENT_STUDY

output:
  encoding: utf-8-sig
