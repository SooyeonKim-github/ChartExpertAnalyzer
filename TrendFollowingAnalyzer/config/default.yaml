universe:
  top_n: 100
  candidate_multiplier: 3
  min_price: 1000
  exclude_spac: true

data:
  history_days: 520

rule_policy:
  # Experimental/Backtest-only rules are recorded but never remove candidates.
  experimental_filters_enabled: false

trend:
  # LECTURE_CORE
  ma_short: 50
  ma_long: 150
  slope_lookback: 20

  # EXPERIMENTAL + BACKTEST_ONLY
  # The lecture says slope should point upward/downward, but gives no 0.30% threshold.
  experimental_slope_threshold_pct: 0.30

market_regime:
  history_days: 520

  # LECTURE_CORE
  # 30-week MA is approximated by daily MA150.
  ma_short: 50
  ma_long: 150
  slope_lookback: 20

  # EXPERIMENTAL + BACKTEST_ONLY
  experimental_slope_threshold_pct: 0.30

  # LECTURE_CORE but not implemented yet in Phase 4A.
  breadth_52w:
    mode: PLANNED
  intraday_strength:
    mode: PLANNED
  news_reaction:
    mode: PLANNED

output:
  encoding: utf-8-sig
