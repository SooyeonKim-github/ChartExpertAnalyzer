universe:
  top_n: 100
  candidate_multiplier: 3
  min_price: 1000
  exclude_spac: true

data:
  history_days: 520

rule_policy:
  # Experimental/Backtest-only rules are recorded but never remove candidates.
  experimental_filters_enabled: false

trend:
  # LECTURE_CORE
  ma_short: 50
  ma_long: 150
  slope_lookback: 20
  # EXPERIMENTAL + BACKTEST_ONLY
  experimental_slope_threshold_pct: 0.30

market_regime:
  history_days: 520
  # LECTURE_CORE
  ma_short: 50
  ma_long: 150
  slope_lookback: 20
  # EXPERIMENTAL + BACKTEST_ONLY
  experimental_slope_threshold_pct: 0.30

  breadth_52w:
    mode: BACKTEST_ONLY
    enabled: true
    lookback_sessions: 252
    min_history_sessions: 252
    short_window: 5
    long_window: 20
    min_coverage_ratio: 0.60
    # KRX all-ticker snapshot이 반복 실패하면 MarketData 공통 fallback으로 전환.
    snapshot_fail_fast: 2
    allow_current_universe_fallback: true

  intraday_strength:
    mode: BACKTEST_ONLY
    enabled: true
    strong_clv_threshold: 0.70
    weak_clv_threshold: 0.30
    short_window: 5
    long_window: 20

  # Intentionally deferred.
  news_reaction:
    mode: PLANNED

relative_strength:
  # LECTURE_CORE concept, numeric choices are EXPERIMENTAL.
  mode: BACKTEST_ONLY
  enabled: true
  short_window: 20
  long_window: 60
  experimental_min_percentile: 80.0

output:
  encoding: utf-8-sig
